# Local development in OrbStack, with code reload:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
name: lattice-dev

services:
  lattice-web:
    # Source is mounted, so edits to app/ reload without a rebuild
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
    # Debug server: reachable from this Mac only
    ports: !override
      - "127.0.0.1:${WEB_PORT:-5001}:5000"
    entrypoint: ["sh", "-c", "LATTICE_NO_SCHEDULER=1 flask db upgrade && exec flask run --host 0.0.0.0 --port 5000 --debug"]
    networks: [lattice, sso]
    environment:
      FLASK_ENV: development
      # The local authentik in dev/authentik speaks plain http
      OIDC_ALLOW_HTTP: "1"

volumes:
  db_data:
    name: lattice-dev-data

networks:
  # Shared with dev/authentik so lattice can reach authentik.localhost
  sso:
    name: lattice-sso
    external: true
