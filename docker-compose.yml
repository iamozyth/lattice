services:
  lattice-db:
    image: postgres:15-alpine
    container_name: lattice-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lattice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lattice}
    expose:
      - "5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - lattice
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lattice} -d ${POSTGRES_DB:-lattice}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  lattice-web:
    build: .
    image: lattice:latest
    pull_policy: build
    container_name: lattice-web
    ports:
      - "${WEB_PORT:-5001}:5000"
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-lattice}:${POSTGRES_PASSWORD}@lattice-db:5432/${POSTGRES_DB:-lattice}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      # Encrypts stored connector credentials
      CONNECTOR_SECRET: ${CONNECTOR_SECRET:?set CONNECTOR_SECRET in .env}
    depends_on:
      lattice-db:
        condition: service_healthy
    networks:
      - lattice
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  db_data:
    # Name kept from netdoc-ipam so existing installs keep their data
    name: ipam-db-data

networks:
  lattice:
    name: lattice
