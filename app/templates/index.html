<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>lattice</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/favicon-180.png">
  <link rel="stylesheet" href="/static/css/app.css?v={{ version }}">
  <script type="module" src="/static/js/main.js?v={{ version }}"></script>
</head>
<body>
<svg class="hidden" aria-hidden="true">
  <symbol id="i-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#/subnets"><span class="dot"></span><h1>lattice</h1></a>
    <nav id="nav" aria-label="Main">
      <a href="#/subnets" data-nav="subnets">Subnets</a>
      <a href="#/addresses" data-nav="addresses">Addresses</a>
      <a href="#/drift" data-nav="drift">Drift <span class="count" id="drift-count"></span></a>
      <a href="#/connectors" data-nav="connectors" data-role="admin">Connectors</a>
      <a href="#/settings" data-nav="settings">Settings</a>
    </nav>
    <form class="search" id="search-form" role="search">
      <input id="search" type="search" placeholder="Search  /" aria-label="Search addresses, hostnames and MACs" autocomplete="off" spellcheck="false">
    </form>
    <span class="who" id="who"></span>
    <button class="ghost" data-action="logout">Log out</button>
  </header>

  <main id="view" tabindex="-1"></main>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
</body>
</html>
