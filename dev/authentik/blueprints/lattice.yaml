# yaml-language-server: $schema=https://goauthentik.io/blueprints/schema.json
# lattice application, OIDC provider, groups and test users for local development.
version: 1
metadata:
  name: lattice (development)
entries:
  - model: authentik_core.group
    id: admins
    identifiers: {name: lattice-admins}
  - model: authentik_core.group
    id: editors
    identifiers: {name: lattice-editors}
  - model: authentik_core.group
    id: viewers
    identifiers: {name: lattice-viewers}

  # alice: admin, bob: viewer, carol: in no lattice group (refused)
  - model: authentik_core.user
    identifiers: {username: alice}
    attrs:
      name: Alice
      email: alice@example.com
      password: !Env LATTICE_TEST_PASSWORD
      groups: [!KeyOf admins]
  - model: authentik_core.user
    identifiers: {username: bob}
    attrs:
      name: Bob
      email: bob@example.com
      password: !Env LATTICE_TEST_PASSWORD
      groups: [!KeyOf viewers]
  - model: authentik_core.user
    identifiers: {username: carol}
    attrs:
      name: Carol
      email: carol@example.com
      password: !Env LATTICE_TEST_PASSWORD

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: {name: lattice}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      grant_types: [authorization_code, refresh_token]
      client_id: lattice
      client_secret: !Env LATTICE_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:5001/auth/oidc/callback
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
  - model: authentik_core.application
    identifiers: {slug: lattice}
    attrs:
      name: lattice
      provider: !KeyOf provider
      meta_launch_url: http://localhost:5001/
